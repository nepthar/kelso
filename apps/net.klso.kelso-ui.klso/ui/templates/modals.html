{#- The dialog every page shares, modal to its own window. confirm.js drives
  it: any form with `data-confirm` asks it before submitting. -#}
<div id="ask-shade" class="shade" hidden>
<div class="pane job-modal" role="dialog" aria-modal="true" aria-labelledby="ask-title">
  <div class="titlebar"><div class="titlebar-text" id="ask-title">Are you sure?</div></div>
  <div class="job-body">
    <p id="ask-text"></p>
    <div class="row job-bar"><button type="button" id="ask-go" class="default">Yes, continue</button><button type="button" id="ask-close">Cancel</button></div>
  </div>
</div></div>
