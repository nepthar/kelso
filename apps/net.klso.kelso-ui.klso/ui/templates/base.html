{#- The document around every page. `frame.html` and `solo.html` fill `body`. -#}
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · kelso</title>
<link rel="icon" type="image/svg+xml" href="{{ FAVICON }}">
<link rel="stylesheet" href="{{ asset('theme.css') }}">
{#- The desktop's two colours (settings.py), painted by boot.js before first paint. -#}
<script type="application/json" id="kelso-desktop">{{ desktop_colors()|list|tojson }}</script>
<script src="{{ asset('js/boot.js') }}"></script>
<link rel="stylesheet" href="{{ asset('vendor/98.css-0.1.21/98.css') }}">
<link rel="stylesheet" href="{{ asset('kelso.css') }}">
<link rel="stylesheet" href="{{ asset('classic.css') }}">
{% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body></html>
