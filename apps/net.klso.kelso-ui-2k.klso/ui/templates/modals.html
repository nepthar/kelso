{#- The two dialogs every page shares, modal to their own window. jobs.js drives
  the first: any `.job-open` button fills it from its data attributes.
  confirm.js drives the second: any form with `data-confirm` asks it before
  submitting. -#}
<div id="job-shade" class="shade" hidden>
<div class="window job-modal" role="dialog" aria-modal="true" aria-labelledby="job-title">
  <div class="title-bar"><div class="title-bar-text" id="job-title"></div>
    <div class="title-bar-controls"><button type="button" id="job-dismiss" aria-label="Close" hidden></button></div></div>
  <div class="job-body">
    <p class="muted" id="job-desc"></p>
    <div class="job-choices" id="job-choices" hidden></div>
    <div class="row job-fields" id="job-fields"></div>
    <div class="row job-bar" id="job-bar"><button type="button" id="job-go" class="default">OK</button><button type="button" id="job-close">Cancel</button></div>
    <progress id="job-progress" hidden></progress>
    <pre id="job-out" class="job-out" hidden></pre>
  </div>
</div></div>
<div id="ask-shade" class="shade" hidden>
<div class="window job-modal" role="dialog" aria-modal="true" aria-labelledby="ask-title">
  <div class="title-bar"><div class="title-bar-text" id="ask-title">Are you sure?</div></div>
  <div class="job-body">
    <p class="muted" id="ask-text"></p>
    <div class="row job-bar"><button type="button" id="ask-go" class="default">Yes, continue</button><button type="button" id="ask-close">Cancel</button></div>
  </div>
</div></div>
