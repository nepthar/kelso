[app]
version      = "1.0.0"
display_name = "Kelso UI"
description  = "Web interface for kelso, over the kelsod admin socket"

[config]
# Docker Desktop on macOS cannot carry the admin socket into a container: run
# `kelsod --port N` and set this to host.docker.internal:N. Empty, the app uses
# the socket, which is all a Linux host needs.
api_address = { default = "", desc = "host:port of kelsod, instead of the admin socket" }
admin_pass  = { secret = true, desc = "password for the web ui" }

[adv_config]
subdomain   = { default = "kelso" }
instance_id = { secret = true, default = "{hex:4}", desc = "Shown beside the hostname, to tell kelso-ui installs apart" }

[volumes]
ui   = { kind = "app", src = "ui", desc = "The application"}
venv = { kind = "temp", desc = "virtual env, dependencies, etc." }
tls  = { kind = "data", desc = "self-signed cert for the https listener" }

[connections]
admin = { kind = "kelso.admin", desc = "kelsod's admin API, which this app is a face for" }

[run.main]
image   = "ghcr.io/astral-sh/uv:python3.12-bookworm-slim"
cmd     = ["/app/start.sh"]
volumes = { ui = "/app", venv = "/venv", tls = "/tls" }
connections = ["admin"]
routes  = { main = { port = "8080", scheme = "https" } }
# Accepting a TCP connection is enough: every page sits behind the sign-in and a
# self-signed certificate.
healthcheck = ["python", "-c", "import socket; socket.create_connection(('localhost', 8080), 3)"]

[run.main.env]
KELSO_SOCKET            = "${conn.admin.socket}"
KELSO_API               = "${api_address}"
ADMIN_PASSWORD           = "${admin_pass}"
KELSO_UI_ID              = "${instance_id}"
TLS_DOMAIN               = "${klso.domain}"
PORT                     = "8080"
PYTHONUNBUFFERED         = "1"
UV_PROJECT_ENVIRONMENT   = "/venv"
UV_NO_MANAGED_PYTHON     = "1"
