[project]
name = "kelso-ui"
version = "0.6.0"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=44.0.0",
  "fastapi>=0.121.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
  "uvicorn>=0.34.0",
]

# `start.sh` syncs with --no-dev, so none of this reaches the container.
[dependency-groups]
dev = [
  "pytest>=9.0.3",
  # httpx2 backs starlette's TestClient.
  "httpx2>=2.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../tests"]
